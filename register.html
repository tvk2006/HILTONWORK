<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilton Hotels - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fa-3x text-warning"></i>
                            <h2 class="mt-3">Crear una Cuenta</h2>
                        </div>
                        
                        <form class="row g-3">
                            <div class="col-12">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ana García Pérez" required>
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="su-correo@ejemplo.com" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            
                            
                            <div class="col-12">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" placeholder="Calle 100 #19-50, Bogotá">
                            </div>
                            
                           
                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="3101234567">
                            </div>
                            <div class="col-md-6">
                                <label for="pais" class="form-label">País</label>
                                <select id="pais" class="form-select" required>
                                    <option value="" selected disabled>Seleccionar...</option>
                                    <option value="CO">Colombia</option>
                                    <option value="US">Estados Unidos</option>
                                    <option value="AR">Argentina</option>
                                    <option value="ES">España</option>
                                    <option value="MX">México</option>
                                </select>
                            </div>
                            
                            <div class="col-12 mt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="esAgencia">
                                    <label class="form-check-label" for="esAgencia">
                                        Registrarse como agencia de viajes
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="residenciaFiscal">
                                    <label class="form-check-label" for="residenciaFiscal">
                                        Soy residente fiscal en Colombia
                                    </label>
                                </div>
                            </div>
                            
                            <div class="col-12 d-grid mt-4">
                                <button type="submit" class="btn btn-warning btn-lg">Registrarse</button>
                            </div>
                            
                            
                            <div class="text-center mt-3">
                                <p class="mb-0">¿Ya tienes una cuenta? <a href="/vista_login.html" class="text-warning text-decoration-none">Inicia sesión</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
