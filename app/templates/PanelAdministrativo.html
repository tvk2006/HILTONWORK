<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Hilton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-primary bg-opacity-75 p-0">
                <div class="d-flex flex-column h-100">
                    <div class="text-center p-4 border-bottom border-warning">
                        <i class="fas fa-hotel fa-2x text-warning mb-2"></i>
                        <h4 class="text-white">HILTON</h4>
                    </div>
                    
                    <div class="p-3 flex-grow-1">
                        <h5 class="text-warning mb-3">PANEL</h5>
                        <ul class="nav flex-column">
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white active bg-warning bg-opacity-25 rounded" href="#">
                                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                                </a>
                            </li>
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white" href="./Gestion Hoteles.html">
                                    <i class="fas fa-building me-2"></i> Gestionar Hoteles
                                </a>
                            </li>
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white" href="./categorias_hotel.html">
                                    <i class="fas fa-tags me-2"></i> Gestionar Categorías
                                </a>
                            </li>
                            <li class="nav-item mb-2">
                                <a class="nav-link text-white" href="./habitacion.html">
                                    <i class="fas fa-bed me-2"></i> Gestionar Habitaciones
                                </a>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="p-3 border-top border-warning">
                        <div class="progress mb-2" style="height: 5px;">
                            <div class="progress-bar bg-warning" style="width: 75%"></div>
                        </div>
                        <small class="text-white-50">Subir: 6/8 / 7/9</small>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <h1 class="text-warning mb-4">Panel de Administración</h1>
                
                <!-- Stats Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card bg-dark border-warning h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title text-white">Hoteles registrados</h5>
                                <h2 class="text-warning">12</h2>
                                <i class="fas fa-building fa-3x text-warning opacity-25 mt-3"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card bg-dark border-warning h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title text-white">Habitaciones</h5>
                                <h2 class="text-warning">80</h2>
                                <i class="fas fa-bed fa-3x text-warning opacity-25 mt-3"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card bg-dark border-warning h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title text-white">Ocupadas</h5>
                                <h2 class="text-warning">32</h2>
                                <i class="fas fa-key fa-3x text-warning opacity-25 mt-3"></i>
                            </div>
                        </div>
                    </div>
                </div>
    
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
